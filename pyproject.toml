[project]
name = "tttrkit"
dynamic = ["version"]
description = "Streaming reader and decoder for PicoQuant TTTR files"
authors = [{ name = "Dalibor Panek" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

dependencies = [
    "numpy",
    "scipy",
    "xarray",
]

[project.optional-dependencies]
# tttrkit.analysis.visualization
plot = [
    "matplotlib",
]
dev = [
    "matplotlib",
    "pytest",
]

[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/tttrkit/_version.py"

[tool.uv.workspace]
members = [
    "examples",
    ".",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test this checkout, regardless of what is installed in the environment
pythonpath = ["src"]
